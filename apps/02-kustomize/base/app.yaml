apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-app
  labels:
    app: kustomize-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kustomize-app
  template:
    metadata:
      labels:
        app: kustomize-app
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: kustomize-app-config
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kustomize-app
  labels:
    app: kustomize-app
spec:
  type: ClusterIP
  selector:
    app: kustomize-app
  ports:
    - name: http
      port: 80
      targetPort: 80
