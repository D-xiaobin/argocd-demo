# 功能点：Kustomize base（被 dev / prod 两个 overlay 复用）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app.yaml

commonLabels:
  app.kubernetes.io/part-of: argocd-demo
  app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: kustomize-app-config
    literals:
      - APP_ENV=base
      - LOG_LEVEL=info

images:
  - name: nginx
    newTag: 1.27-alpine
