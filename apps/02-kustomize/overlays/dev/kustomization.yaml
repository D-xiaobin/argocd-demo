# 功能点：overlay 覆盖 base —— 命名空间、副本数、环境变量
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

namePrefix: dev-

resources:
  - ../../base

replicas:
  - name: kustomize-app
    count: 1

configMapGenerator:
  - name: kustomize-app-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=debug

commonLabels:
  env: dev
