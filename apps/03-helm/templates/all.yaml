apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-helm-config
  labels:
    app: {{ .Release.Name }}-helm
    app.kubernetes.io/part-of: argocd-demo
data:
{{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
  RELEASE_NAME: {{ .Release.Name | quote }}
  CHART_VERSION: {{ .Chart.Version | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-helm
  labels:
    app: {{ .Release.Name }}-helm
    app.kubernetes.io/part-of: argocd-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-helm
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-helm
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-helm-config
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-helm
  labels:
    app: {{ .Release.Name }}-helm
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-helm
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 80
