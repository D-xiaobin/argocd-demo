# 功能点：多集群 —— 用 cluster Secret 注册第二个集群
# 配套第 8 章：kubeconfig → Secret 的映射关系在这里可以直接看到
# 生成方式（推荐用脚本，不要手抄）：
#   ./scripts/kubeconfig2argocd.sh <context> <name> > cluster-xxx.yaml
#
# 下面是「证书认证」的模板，把三个 base64 换成真实值即可
apiVersion: v1
kind: Secret
metadata:
  name: cluster-example
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    # 这两个 label 给 ApplicationSet 的 clusters 生成器用
    env: prod
    region: cn-hangzhou
type: Opaque
stringData:
  name: example-cluster
  server: https://172.16.0.10:6443
  config: |
    {
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<base64 的 CA 证书>",
        "certData": "<base64 的客户端证书>",
        "keyData": "<base64 的客户端私钥>"
      }
    }
  # 可选：限定这个集群只能操作哪些命名空间，能显著降低 watch 压力
  # namespaces: "demo-basic,demo-prod"
