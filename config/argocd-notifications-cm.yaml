# 功能点：通知 —— 触发器 + 模板 + 订阅 + 自定义 webhook
# 应用：kubectl -n argocd apply -f config/argocd-notifications-cm.yaml
# 验证：同步任意应用，观察 webhook 是否收到（可把 url 换成本机 httpbin）
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # ① 自定义 webhook 服务
  service.webhook.demo: |
    url: https://webhook.example.com/argocd
    headers:
      - name: Content-Type
        value: application/json

  # ② 模板：同步成功
  template.app-sync-succeeded: |
    webhook:
      demo:
        method: POST
        path: /sync-succeeded
        body: |
          {
            "app": "{{.app.metadata.name}}",
            "project": "{{.app.spec.project}}",
            "sync": "{{.app.status.sync.status}}",
            "health": "{{.app.status.health.status}}",
            "revision": "{{.app.status.sync.revision}}"
          }

  # ③ 模板：健康状态退化
  template.app-degraded: |
    webhook:
      demo:
        method: POST
        path: /degraded
        body: |
          {
            "app": "{{.app.metadata.name}}",
            "health": "{{.app.status.health.status}}",
            "message": "{{.app.status.health.message}}"
          }

  # ④ 触发器
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]
  trigger.on-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-degraded]

  # ⑤ 订阅（recipients 对应 service 名）
  subscriptions: |
    - recipients: [demo]
      triggers: [on-sync-succeeded, on-degraded]
